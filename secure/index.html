<!DOCTYPE html>
<html>
<head><title>Page</title></head>
<body>

<html>
  <head>
    <meta charset="utf-8">
    <title>404 Page Not Found</title>
    <style media="screen">
      html,body{
        margin: 0;
        padding: 0;
      }

      canvas{
        display: block;
      }
    </style>
  </head>
  <body>

    <script type="text/javascript">
      var canvas = document.createElement('canvas');
      var height = canvas.height = window.innerHeight;
      var width = canvas.width = window.innerWidth;
      var ctx = canvas.getContext('2d');
      document.body.appendChild(canvas);

      function random(min,max)
      {
          return Math.random()*(max-min+1)+min;
      }

      function range_map(value,in_min, in_max, out_min, out_max) {
        return (value - in_min) * (out_max - out_min) / (in_max - in_min) + out_min;
      }

      var word_arr = [];
      var txt_min_size = 5;
      var txt_max_size = 25;
      var keypress = false;
      var acclerate = 2;
      for (var i = 0; i < 25; i++) {
        word_arr.push({
          x : random(0,width),
          y : random(0,height),
          text : '404',
          size : random(txt_min_size,txt_max_size)
        });

        word_arr.push({
          x : random(0,width),
          y : random(0,height),
          text : 'page',
          size : random(txt_min_size,txt_max_size)
        });


        word_arr.push({
          x : random(0,width),
          y : random(0,height),
          text : 'not found',
          size : random(txt_min_size,txt_max_size)
        });

        word_arr.push({
          x : random(0,width),
          y : random(0,height),
          text : '404',
          size : Math.floor(random(txt_min_size,txt_max_size))
        });
      }

      function render()
      {
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0,0,width,height);

        ctx.fillStyle = "#fff";
        for (var i = 0; i < word_arr.length; i++) {
          ctx.font = word_arr[i].size+"px sans-serif";
          var w = ctx.measureText(word_arr[i].text);
          ctx.fillText(word_arr[i].text,word_arr[i].x,word_arr[i].y);

          if(keypress)
          {
            word_arr[i].x += range_map(word_arr[i].size,txt_min_size,txt_max_size,2,4) * acclerate;
          }
          else {
            word_arr[i].x += range_map(word_arr[i].size,txt_min_size,txt_max_size,2,3);
          }

          if(word_arr[i].x >= width)
          {
            word_arr[i].x = -w.width*2;
            word_arr[i].y = random(0,height);
            word_arr[i].size =  Math.floor(random(txt_min_size,txt_max_size));

          }
        }

        ctx.fill();

        requestAnimationFrame(render);
      }

      render();

      window.addEventListener('keydown',function(){
        keypress = true;
      },true);
      window.addEventListener('keyup',function(){
        keypress = false;
      },true);
    </script>
  </body>
</html>


  <script>
    function generateToken(ts) {
      const t = ts.toString();
      let hash = 0;
      for (let i = 0; i < t.length; i++) {
        hash = Math.imul(31, hash) + t.charCodeAt(i) | 0;
      }
      hash = Math.imul(hash, 0x9e3779b9) | 0;
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_~';
      let result = '';
      let n = Math.abs(hash);
      for (let i = 0; i < 20; i++) {
        result += chars[n % chars.length];
        n = Math.imul(n, 1664525) + 1013904223 | 0;
        n = Math.abs(n);
      }
      return result;
    }

    function currentBucket() {
      return Math.floor(Date.now() / 100) * 100;
    }

    function isValidToken(token) {
      const now = currentBucket();
      for (let i = -3; i <= 3; i++) {
        if (generateToken(now + i * 100) === token) return true;
      }
      return false;
    }

    function updateURL() {
      location.hash = generateToken(currentBucket());
    }

    const arrivedToken = location.hash.replace('#', '');

    if (arrivedToken) {
      if (!isValidToken(arrivedToken)) {
        document.body.innerHTML = '<h1>404 Not Found</h1>';
      } else {
        let last = 0;
        function loop(ts) {
          if (ts - last >= 100) { updateURL(); last = ts; }
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
        setInterval(updateURL, 100);
      }
    } else {
      let last = 0;
      function loop(ts) {
        if (ts - last >= 100) { updateURL(); last = ts; }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
      setInterval(updateURL, 100);
    }
  </script>

</body>
</html>
