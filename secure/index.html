<!DOCTYPE html>
<html>
<head><title>Page</title></head>
<body>

  <!-- your actual content here -->
  <h1>Welcome</h1>

  <script>
    function generateToken(ts) {
      const t = ts.toString();
      let hash = 0;
      for (let i = 0; i < t.length; i++) {
        hash = Math.imul(31, hash) + t.charCodeAt(i) | 0;
      }
      hash = Math.imul(hash, 0x9e3779b9) | 0;
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_~';
      let result = '';
      let n = Math.abs(hash);
      for (let i = 0; i < 20; i++) {
        result += chars[n % chars.length];
        n = Math.imul(n, 1664525) + 1013904223 | 0;
        n = Math.abs(n);
      }
      return result;
    }

    function currentBucket() {
      return Math.floor(Date.now() / 100) * 100;
    }

    function isValidToken(token) {
      const now = currentBucket();
      for (let i = -3; i <= 3; i++) {
        if (generateToken(now + i * 100) === token) return true;
      }
      return false;
    }

    function updateURL() {
      location.hash = generateToken(currentBucket());
    }

    const arrivedToken = location.hash.replace('#', '');

    if (arrivedToken) {
      if (!isValidToken(arrivedToken)) {
        document.body.innerHTML = '<h1>404 Not Found</h1>';
      } else {
        let last = 0;
        function loop(ts) {
          if (ts - last >= 100) { updateURL(); last = ts; }
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
        setInterval(updateURL, 100);
      }
    } else {
      let last = 0;
      function loop(ts) {
        if (ts - last >= 100) { updateURL(); last = ts; }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
      setInterval(updateURL, 100);
    }
  </script>

</body>
</html>
