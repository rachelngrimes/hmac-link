<!DOCTYPE html>
<html>
<head>
  <title>Page</title>
</head>
<body>

  <!-- your actual page content here -->

  <script>
    function fastToken() {
      const t = Date.now().toString();
      let hash = 0;
      for (let i = 0; i < t.length; i++) {
        hash = Math.imul(31, hash) + t.charCodeAt(i) | 0;
      }
      hash = Math.imul(hash, 0x9e3779b9) | 0;
      
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_~';
      let result = '';
      let n = Math.abs(hash);
      for (let i = 0; i < 20; i++) {
        result += chars[n % chars.length];
        n = Math.imul(n, 1664525) + 1013904223 | 0;
        n = Math.abs(n);
      }
      return result;
    }

    function updateURL() {
      history.replaceState(null, "", "/" + fastToken());
    }

    setInterval(updateURL, 1);
  </script>

</body>
</html>
