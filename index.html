<!DOCTYPE html>
<html>
<head>
  <title>Page</title>
</head>
<body>

  <!-- your actual page content here -->

  <script>
    async function generateToken() {
      const timeWindow = Math.floor(Date.now() / 1);
      const encoder = new TextEncoder();
      const key = await crypto.subtle.importKey(
        "raw", encoder.encode("put-any-random-text-here"),
        { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
      );
      const sig = await crypto.subtle.sign("HMAC", key, encoder.encode(String(timeWindow)));
      return btoa(String.fromCharCode(...new Uint8Array(sig)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '~')
        .substring(0, 20);
    }

    async function updateURL() {
      const token = await generateToken();
      history.replaceState(null, "", "/" + token);
    }

    updateURL();
    setInterval(updateURL, 500);
  </script>

</body>
</html>
